[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "course-work"
version = "0.1.0"
description = "Multivariate time-series regression coursework"
requires-python = ">=3.10,<3.11"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["course_work*"]
namespaces = false
